# Local Airflow stack for the Bitcoin pipeline (LocalExecutor + Postgres).
#
# Usage:
#   docker compose -f docker-compose.airflow.yml build
#   docker compose -f docker-compose.airflow.yml up airflow-init   # one-off: DB + admin user
#   docker compose -f docker-compose.airflow.yml up -d             # scheduler + webserver
#   open http://localhost:8080   (login: admin / admin)
#
# The whole repo is bind-mounted at /opt/airflow/project so the DAG can import
# the local packages, and dbt can find dbt_project.yml / profiles.yml / data/.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: bitcoin-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/bitcoin_pipeline/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Cosmos runs `dbt ls` while parsing the DAG; the cold first parse can exceed
    # the default 30s/50s limits, so give the parser more headroom.
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: "120"
    # Import path for the project packages (config, ingestion, ...)
    PYTHONPATH: /opt/airflow/project/bitcoin_pipeline
    # dbt lives in an isolated venv inside the image
    DBT_BIN: /opt/dbt-venv/bin/dbt
    # local Bronze + duckdb land here (shared with the dashboard on the host)
    DATA_DIR: /opt/airflow/project/bitcoin_pipeline/data
    DUCKDB_PATH: /opt/airflow/project/bitcoin_pipeline/data/bitcoin_pipeline.duckdb
    # Bronze storage target: point ingestion + dbt at the bundled MinIO service.
    # This flips both the Python writer (write_bronze) and the dbt bronze_path
    # macro over to S3; DBT_TARGET=minio selects the httpfs dbt profile.
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: bitcoin-pipeline-bronze
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_REGION: ap-southeast-1
    DBT_TARGET: minio
    # dbt + Cosmos phone home to scarf.sh after each task for anonymous usage
    # metrics. The container has no reliable outbound internet, so each call
    # blocks 3-20s until it times out — killing DAG throughput. Opt out.
    DO_NOT_TRACK: "1"
  volumes:
    - ./:/opt/airflow/project
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # S3-compatible object storage for the Bronze data lake (local stand-in for AWS S3).
  #   API  : http://localhost:9000   Console: http://localhost:9001  (minioadmin/minioadmin)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: always

  # One-off: wait for MinIO, then create the Bronze bucket (idempotent), then exit.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing local/bitcoin-pipeline-bronze
        echo "bucket ready"
    restart: on-failure

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # One-off init: migrate metadata DB + create the admin user, then exit.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:
  minio-data:
