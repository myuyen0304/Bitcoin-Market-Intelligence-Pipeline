name: CI

# Continuous Integration for the Bitcoin data pipeline.
# Runs fast, deterministic checks that do NOT depend on external APIs
# (live CoinGecko/Binance/Fear&Greed calls are flaky on CI runners and
# Binance geo-blocks US-based GitHub runners), so this job stays green
# for code-quality reasons only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, compile & dbt parse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check bitcoin_pipeline

      - name: Syntax check (compile all modules)
        run: python -m compileall -q bitcoin_pipeline

      # Install dbt packages (Elementary) into dbt_packages/ so `dbt parse` can
      # resolve them — packages.yml pins the deps; without this dbt errors with
      # "found N package(s) specified in packages.yml, but only 0 installed".
      - name: dbt deps (install package dependencies)
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
        run: dbt deps

      - name: dbt parse (validate models & refs)
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
        run: dbt parse
