name: bitcoin_pipeline
version: "1.0.0"
config-version: 2

profile: bitcoin_pipeline

model-paths: ["bitcoin_pipeline/dbt/models"]
test-paths: ["bitcoin_pipeline/dbt/tests"]
macro-paths: ["bitcoin_pipeline/dbt/macros"]

clean-targets:
  - target
  - dbt_packages

models:
  bitcoin_pipeline:
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: table
  # Elementary observability package: its models store dbt run/test results +
  # metadata so `edr` can build the HTML report. Isolated in its own schema.
  elementary:
    +schema: elementary
    # Hide Elementary's ~30 internal models from the dbt docs site so the public
    # lineage graph shows only our 7 pipeline models (staging → int → marts).
    +docs:
      show: false
