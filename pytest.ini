[pytest]
# Unit tests live next to the code they cover.
testpaths = bitcoin_pipeline/tests

# `integration` marks tests that hit live external APIs (CoinGecko/Binance/
# Fear&Greed). They are flaky on CI runners and Binance geo-blocks GitHub's
# US IPs, so they are DESELECTED by default via addopts below. Run them
# explicitly with:  pytest -m integration
markers =
    integration: hits live external APIs; excluded from the default run

# Default run = unit tests only (offline, deterministic — safe for CI).
# A command-line -m overrides this, so `pytest -m integration` still works.
addopts = -m "not integration"
